name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch: # Mamela anao handefa ilay build amin'ny fomba manual

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Maka ny kaody ao amin'ny repository (Checkout)
        uses: actions/checkout@v4

      - name: Mametraka Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Mametraka Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Mametraka ny dépendances (npm install)
        run: npm install

      - name: Manampy ny platform Android (cap add android)
        run: npx cap add android

      - name: Mamorona ny icon sy splash screen
        run: npx capacitor-assets generate --android

      - name: Mampifandray ny www/ amin'ny Android (cap sync)
        run: npx cap sync android

      - name: Manome alalana ny fitaovana Gradlew
        run: chmod +x android/gradlew

      - name: Mamorona ilay APK (Build)
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Mitahiry ilay APK (Upload Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
