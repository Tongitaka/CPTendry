
name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch: # Mamela anao handefa ilay build amin'ny fomba manual

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Maka ny kaody ao amin'ny repository (Checkout)
        uses: actions/checkout@v4

      - name: Mametraka Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Manome alalana ny fitaovana Gradlew
        run: chmod +x gradlew

      - name: Mamorona ilay APK (Build)
        run: ./gradlew assembleDebug

      - name: Mitahiry ilay APK (Upload Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
